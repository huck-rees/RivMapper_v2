name: rivmapper_v2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - geopandas
  - rasterio
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-image
  - jupyterlab
  - ipywidgets
  - geemap
  - earthengine-api
  - ipyleaflet
  - pyogrio
  - shapely>=2.0
  - pydantic>=2.5
  - pyyaml
  - requests
  - tqdm
  - pooch>=1.8
  # step discharge: GloFAS (default; EWDS client + NetCDF) and GEOGLOWS v2 (AWS)
  - xarray
  - netcdf4
  - ecmwf-datastores-client
  - zarr
  - s3fs
  - pyarrow
  # learned mask cleaning (clean_masks with a model, rivmapper ml train)
  - scikit-learn
  - pytest
  - pip
  - pip:
      - -e ".[dev]"
