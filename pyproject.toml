[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rivmapper_v2"
version = "0.3.0"
description = "Next-generation channel mobility, sediment storage, and transit time analysis for alluvial rivers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "James \"Huck\" Rees" },
]
dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "rasterio",
    "numpy",
    "pandas>=2.1",
    "matplotlib",
    "scipy",
    "pydantic>=2.5",
    "pyyaml",
    "requests",
    "tqdm",
    "pooch>=1.8",
]

[project.scripts]
rivmapper = "rivmapper_v2.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["rivmapper_v2*"]

[tool.setuptools.package-data]
rivmapper_v2 = ["datasets.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint.per-file-ignores]
"rivmapper_v2/templates.py" = ["E501"]  # YAML template text

[tool.pytest.ini_options]
testpaths = ["tests"]
