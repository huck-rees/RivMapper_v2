[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rivmapper_v2"
version = "0.1.0"
description = "Next-generation channel mobility, sediment storage, and transit time analysis for alluvial rivers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "James \"Huck\" Rees" },
]
dependencies = [
    "geopandas",
    "rasterio",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["rivmapper_v2*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
